version: '3.8'
services:
  db:
    image: postgres:15
    container_name: promobridge-postgres
    environment:
      POSTGRES_DB: promobridge
      POSTGRES_USER: promobridge
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
