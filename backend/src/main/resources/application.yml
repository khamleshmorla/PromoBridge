spring:
  application:
    name: PromoBridgeAPI
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/promobridge}
    username: ${DB_USERNAME:promobridge}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://pleasant-llama-93.clerk.accounts.dev}

promobridge:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
  cloudinary:
    url: ${CLOUDINARY_URL:}

server:
  port: 8080
  error:
    include-message: always
